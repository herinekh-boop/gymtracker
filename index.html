<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the app use the whole screen (around the notch) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gym Tracker</title>
  <meta name="description" content="Personal gym tracker — works offline.">
  <meta name="theme-color" content="#0b0b0f">
  <!-- iPhone "Add to Home Screen" settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="update-bar" hidden>✨ A new version is ready — tap to update</div>
  <main id="view"><p class="muted" style="padding:2rem">Loading…</p></main>
  <div id="timer"></div>
  <nav id="tabbar"></nav>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Chart library (stored locally so charts work offline) -->
  <script src="vendor/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
